<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Landrop 图标矢量版：与 assets/icon.png 同构 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#3ECF8E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="26"/>
    </filter>
    <clipPath id="rounded"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="459" fill="#FFFFFF" opacity="0.10"/>
    <g filter="url(#shadow)" opacity="0.35" transform="translate(0 26)">
      <polygon points="852,142 614,822 478,516 172,380" fill="#0A1428"/>
    </g>
    <polygon points="852,142 478,516 172,380" fill="#FFFFFF"/>
    <polygon points="852,142 614,822 478,516" fill="#FFFFFF" opacity="0.84"/>
  </g>
</svg>
